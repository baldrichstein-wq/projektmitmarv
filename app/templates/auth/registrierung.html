<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrierung - Das Rezeptbuch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
        body {
            background-image: url("{{ url_for('static', filename='images/Hintergrund1.jpg') }}");
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-color: #f4e3d7;
            margin: 0; padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-custom {
            background-color: #d9534f;
            color: white;
        }
        .btn-custom:hover {
            background-color: #c9302c;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <div class="text-center mb-4">
                        <h2 style="font-family: 'Times New Roman', serif; color: #333;">Neu registrieren</h2>
                        <p class="text-muted">Erstelle ein Konto für das Rezeptbuch</p>
                    </div>

                    <!-- Flash Messages -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                      {% if messages %}
                        {% for category, message in messages %}
                          <div class="alert alert-{{ category }} small">{{ message }}</div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}

                    <form action="{{ url_for('auth.registrierung') }}" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" name="name" required placeholder="Dein Name">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">E-Mail-Adresse</label>
                            <input type="email" class="form-control" id="email" name="email" required placeholder="beispiel@mail.de">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Passwort</label>
                            <input type="password" class="form-control" id="password" name="password" required placeholder="********">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-custom">Konto erstellen</button>
                        </div>
                    </form>
                    
                    <hr>
                    <div class="text-center">
                        <p class="small">Hast du bereits ein Konto? <a href="{{ url_for('auth.anmeldung') }}">Hier anmelden</a></p>
                        <a href="{{ url_for('main.home') }}" class="text-secondary small">Zurück zur Startseite</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
